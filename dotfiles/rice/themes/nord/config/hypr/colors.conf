# =============================================================================
#  Nord Theme Colors for Hyprland
#  Arctic, north-bluish color scheme
# =============================================================================

# Polar Night (backgrounds)
$pol1 = rgba(2e3440ff)    # Dark background
$pol2 = rgba(3b4252ff)    # Lighter background
$pol3 = rgba(434c5eff)    # Even lighter
$pol4 = rgba(4c566aff)    # Lightest background

# Snow Storm (foreground/text)
$snow1 = rgba(d8dee9ff)   # Light text
$snow2 = rgba(e5e9f0ff)   # Lighter text
$snow3 = rgba(eceff4ff)   # Brightest text

# Frost (accents/blues)
$frost1 = rgba(8fbcbbff)  # Teal
$frost2 = rgba(88c0d0ff)  # Cyan (primary accent)
$frost3 = rgba(81a1c1ff)  # Blue
$frost4 = rgba(5e81acff)  # Dark blue

# Aurora (warnings/highlights)
$aurora1 = rgba(bf616aff) # Red
$aurora2 = rgba(d08770ff) # Orange
$aurora3 = rgba(ebcb8bff) # Yellow
$aurora4 = rgba(a3be8cff) # Green
$aurora5 = rgba(b48eadff) # Purple

# ============= HYPRLAND COLOR ASSIGNMENTS =============
# Active window border
col.active_border = $frost2

# Inactive window border
col.inactive_border = $pol2

# Floating window background
col.float_shadow = $pol1

# Optional: Define in general.conf or decoration.conf
# These are for reference:
# col.shadow = $pol1 with reduced opacity
# col.inactive_border_2 = $pol3
