# Ultrawide single display setup (5120x1440 or similar)
# Treat as extended horizontal space

# Ultrawide monitor with preferred resolution
monitor = DP-1, preferred, auto, 1
monitor = HDMI-1, preferred, auto, 1
monitor = eDP-1, preferred, auto, 1

# Fallback for any other connected monitor
monitor = , preferred, auto, 1

# Note: Workspace configuration should be in workspaces.conf, not here
