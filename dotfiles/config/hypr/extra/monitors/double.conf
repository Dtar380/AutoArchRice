# Dual monitor setup
# Primary monitor (usually left): HDMI-1 or DP-1
# Laptop display (usually right): eDP-1

# Left monitor (primary)
monitor = HDMI-1, 1920x1080, 0x0, 1

# Right monitor (laptop/secondary)
monitor = eDP-1, 1920x1080, 1920x0, 1

# Workspace distribution: 1-2 on primary, 3-4 on secondary
workspace = 1, monitor:HDMI-1
workspace = 2, monitor:HDMI-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
