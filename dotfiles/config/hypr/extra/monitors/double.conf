# Dual monitor setup
# Primary monitor (usually left): HDMI-1 or DP-1
# Laptop display (usually right): eDP-1

# Monitors with preferred resolution and auto positioning
monitor = HDMI-1, preferred, auto, 1
monitor = eDP-1, preferred, auto, 1
monitor = DP-1, preferred, auto, 1
monitor = DP-2, preferred, auto, 1

# Fallback for any other connected monitor
monitor = , preferred, auto, 1

# Note: Workspace configuration should be in workspaces.conf, not here
