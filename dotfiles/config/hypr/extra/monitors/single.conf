# Single monitor setup (laptop or single display desktop)
# Adjust 'eDP-1' or 'HDMI-1' to match your actual monitor name
# Get monitor names with: hyprctl monitors

monitor = eDP-1, 1920x1080, 0x0, 1

# Fallback for desktop single monitor
monitor = HDMI-1, 1920x1080, 0x0, 1

# Optional: Set primary workspace on the monitor
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
