# Single monitor setup (laptop or single display desktop)
# Adjust 'eDP-1' or 'HDMI-1' to match your actual monitor name
# Get monitor names with: hyprctl monitors

# Primary monitor configuration
monitor = eDP-1, preferred, auto, 1
monitor = HDMI-1, preferred, auto, 1
monitor = DP-1, preferred, auto, 1
monitor = HDMI-2, preferred, auto, 1

# Fallback: catch-all for any other connected monitor
monitor = , preferred, auto, 1

# Note: Workspace configuration should be in workspaces.conf, not here
