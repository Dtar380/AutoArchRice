# =============================================================================
#  Window Rules Configuration
#  Per-application window behavior and properties
# =============================================================================

# Note: Get window class with: hyprctl clients
# Format: windowrule = RULE, class_name

# ============= FLOATING WINDOWS =============
# Rofi (launcher)
windowrule = float, ^(rofi)$
windowrule = size 50% 50%, ^(rofi)$
windowrule = center, ^(rofi)$

# File manager (Yazi in floating)
windowrule = float, ^(yazi)$
windowrule = size 80% 80%, ^(yazi)$
windowrule = center, ^(yazi)$

# System dialogs
windowrule = float, title:^(Open File)(.*)$
windowrule = float, title:^(Save File)(.*)$
windowrule = float, title:^(About)(.*)$
windowrule = center, title:^(About)(.*)$

# Settings/Preferences
windowrule = float, title:^(Settings)(.*)$
windowrule = float, title:^(Preferences)(.*)$

# ============= FULLSCREEN/MAXIMIZED =============
# Video players
windowrule = fullscreen, ^(mpv)$
windowrule = fullscreen, ^(vlc)$

# Screen sharing / recording tools
windowrule = fullscreen, title:^(OBS)(.*)$

# ============= OPACITY =============
# Terminal
windowrule = opacity 0.95, ^(kitty)$

# ============= WORKSPACE ASSIGNMENTS =============
# Assign applications to specific workspaces
windowrule = workspace 1, ^(kitty)$
windowrule = workspace 2, ^(zen)$|^(firefox)$|^(chromium)$
windowrule = workspace 3, title:^(nvim)(.*)$
windowrule = workspace 4, ^(discord)$|^(telegram)$|^(slack)$

# ============= NO FOCUS =============
# Don't steal focus when appearing
windowrule = nofocus, ^(notifications)(.*)$
windowrule = nofocus, title:^(Steam)(.*)$

# ============= TITLE BAR REMOVAL =============
# Some apps don't need title bars
windowrule = notitle, ^(rofi)$

# ============= INHIBIT IDLE =============
# Prevent sleep during video playback
windowrule = inhibit_idle fullscreen, ^(mpv)$
windowrule = inhibit_idle fullscreen, ^(zen)$|^(firefox)$

# ============= FREEZE/PAUSE =============
# Pause applications when not visible
windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$

# ============= PICTURE-IN-PICTURE =============
# Keep certain windows always on top
windowrule = float, title:^(Picture in Picture)(.*)$
windowrule = pin, title:^(Picture in Picture)(.*)$
windowrule = size 30% 30%, title:^(Picture in Picture)(.*)$
windowrule = move 70% 70%, title:^(Picture in Picture)(.*)$

# ============= SPECIAL RULES FOR COMMON APPS =============
# Discord
windowrule = workspace 4, ^(discord)$
windowrule = size 1000 700, ^(discord)$

# Steam
windowrule = workspace 4, ^(steam)$
windowrule = float, ^(steam)$
windowrule = center, ^(steam)$

# Game - Fullscreen
windowrulev2 = fullscreen,class:^(steam)$,title:^(.*[Gg]ame.*)$

# Neofetch / System info
windowrule = float, title:^(fastfetch)$
windowrule = center, title:^(fastfetch)$
windowrule = size 80% 80%, title:^(fastfetch)$

# ============= LAYER RULES =============
# These control overlay/panel behavior
layerrule = noanim, notifications
layerrule = blur, notifications
