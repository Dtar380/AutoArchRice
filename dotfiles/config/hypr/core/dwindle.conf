# =============================================================================
#  Dwindle Layout Settings
#  Default tiling layout configuration
# =============================================================================

dwindle {
    # Split new windows in the middle or to the right/bottom
    pseudotile = false

    # Force split (true = vertical/horizontal alternating, false = smart)
    force_split = 0

    # Preserve split ratio when closing windows
    preserve_split = true

    # Special scaling
    special_scale_factor = 0.8
}
