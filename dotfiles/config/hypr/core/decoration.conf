# =============================================================================
#  Window Decoration Settings
#  Borders, shadows, blur effects
# =============================================================================

decoration {
    # Rounding corners
    rounding = 10

    # Active window border color (will use theme colors)
    active_opacity = 1.0
    inactive_opacity = 0.9

    # Fullscreen opacity (0.0 - 1.0)
    fullscreen_opacity = 1.0

    # Drop shadows
    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aaa)

    # Blur
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
        ignore_opacity = false
        popups = false
    }

    # Dim inactive windows slightly
    dim_inactive = false
    dim_strength = 0.5
}
