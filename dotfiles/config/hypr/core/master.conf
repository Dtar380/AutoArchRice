# =============================================================================
#  Master Layout Settings
#  Alternative tiling layout (optional)
# =============================================================================

master {
    # Number of windows in master column
    new_is_master = true

    # New window position
    new_on_top = false

    # Mfact: master window fraction (0.0 - 1.0)
    mfact = 0.55

    # Special scaling
    special_scale_factor = 0.8
}
