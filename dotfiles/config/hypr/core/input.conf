# =============================================================================
#  Input Configuration
#  Mouse, keyboard, touchpad behavior
# =============================================================================

# Note: Keyboard layout is set by installer in keyboard.conf
# This file contains general input behavior

input {
    # Follow mouse focus
    follow_mouse = 1

    # Mouse sensitivity
    sensitivity = 0.0

    # Numlock on startup
    numlock_by_default = true
}

# Touchpad configuration
input {
    touchpad {
        # Natural scrolling (false = traditional, true = natural)
        natural_scroll = false

        # Disable while typing
        disable_while_typing = true

        # Tap to click
        tap-to-click = true

        # Middle mouse button emulation
        middle_button_emulation = false

        # Scroll speed
        scroll_factor = 1.0
    }
}
