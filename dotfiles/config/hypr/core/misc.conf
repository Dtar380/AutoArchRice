# =============================================================================
#  Miscellaneous Settings
#  Various behavior tweaks
# =============================================================================

misc {
    # Disable while typing
    disable_autoreload = false

    # Damage tracking
    damage_entire_workspace = false

    # VFR (Variable Refresh Rate)
    vfr = true

    # Vrr (Variable Refresh Rate for monitors)
    vrr = 0

    # Mouse move efficiency
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false

    # Focus follows mouse (0=off, 1=on, 2=strict)
    focus_on_activate = false

    # Allow binding reserved keys
    allow_reserved_keys = false
}
