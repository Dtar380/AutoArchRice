# =============================================================================

# Define 4 workspaces only
workspace = 1, gaps_in:8, gaps_out:12, border_size:2
workspace = 2, gaps_in:8, gaps_out:12, border_size:2
workspace = 3, gaps_in:8, gaps_out:12, border_size:2
workspace = 4, gaps_in:8, gaps_out:12, border_size:2

# PREVENT workspace creation beyond 4
