# =============================================================================
#  Environment Variables for Hyprland
#  Session-wide environment configuration
# =============================================================================

# ============= WAYLAND & SESSION =============
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ============= QT THEMING (Qt5/Qt6) =============
# Use qt6ct/qt5ct for theme configuration
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland
env = QT_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# ============= GTK / LIBADWAITA =============
# GTK apps will follow system theme
env = GTK_THEME,Adwaita
env = GDK_BACKEND,wayland

# ============= SDL2 BACKEND =============
# Use Wayland for games/SDL apps
env = SDL_VIDEODRIVER,wayland
env = SDL_AUDIODRIVER,pipewire

# ============= CURSOR THEMING =============
# Cursor size and theme
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,default
env = HYPRCURSOR_THEME,default
env = HYPRCURSOR_SIZE,24

# ============= HYPRLAND SPECIFIC =============
# Enable logging
env = HYPRLAND_LOG_WLR,1

# Ignore scaling for specific apps (if needed)
# env = HYPRLAND_NO_SD_NOTIFY,1

# ============= EDITOR & PAGER =============
# Already set in .zshenv, but good to have here
env = EDITOR,nvim
env = VISUAL,nvim
env = PAGER,less

# ============= LANGUAGE & LOCALE =============
# This is set by system, but you can override if needed
# env = LANG,en_US.UTF-8
# env = LC_ALL,en_US.UTF-8

# ============= XDG DIRECTORIES =============
# Standard XDG paths
env = XDG_CONFIG_HOME,$HOME/.config
env = XDG_DATA_HOME,$HOME/.local/share
env = XDG_CACHE_HOME,$HOME/.cache

# ============= COLOR MANAGEMENT =============
# For proper color reproduction
# env = COLORCORRECT,1

# ============= PERFORMANCE TWEAKS =============
# Reduce frame latency
# env = __GL_VSYNC_COUNT,0

# ============= LIBVA (Video Acceleration) =============
# Use hardware acceleration for video
env = LIBVA_DRIVER_NAME,auto

# ============= OPTIONAL: CUSTOM RICE VARS =============
# Useful for rice scripts to access
env = RICE_DIR,$HOME/.local/share/rice
env = RICE_THEME_DIR,$HOME/.local/share/rice/themes
env = RICE_BIN_DIR,$HOME/.local/bin
