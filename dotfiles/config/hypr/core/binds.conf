# =============================================================================
#  Keybindings
#  Terminal-first rice keybindings
# =============================================================================

# Modifier key: SUPER (Windows key)
$mainMod = SUPER

# ============= WORKSPACE MANAGEMENT =============
# Switch to workspace 1-4 (only these 4 exist)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move window to workspace 1-4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Cycle workspaces with arrows
bind = $mainMod, Right, workspace, +1
bind = $mainMod, Left, workspace, -1

# ============= WINDOW MANAGEMENT =============
# Close window
bind = $mainMod, Q, killactive,

# Toggle fullscreen
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Toggle floating
bind = $mainMod, V, togglefloating,

# Focus window direction
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window direction
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows (hold + arrow keys)
binde = $mainMod CTRL, H, resizeactive, -20 0
binde = $mainMod CTRL, L, resizeactive, 20 0
binde = $mainMod CTRL, K, resizeactive, 0 -20
binde = $mainMod CTRL, J, resizeactive, 0 20

# ============= APPLICATION LAUNCHERS =============
# Terminal (Kitty)
bind = $mainMod, Return, exec, kitty

# Application launcher (Rofi)
bind = $mainMod, D, exec, rofi -show drun

# File manager
bind = $mainMod, E, exec, yazi

# Browser
bind = $mainMod, B, exec, zen

# ============= SYSTEM CONTROLS =============
# Volume control (with pamixer)
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioMute, exec, pamixer -t

# Brightness control (with brightnessctl)
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%

# Screenshot (Hyprshot)
bind = , Print, exec, hyprshot -m region --clipboard-only

# Lock screen
bind = $mainMod SHIFT, L, exec, hyprlock

# ============= LAYOUT TOGGLES =============
# Switch layout between dwindle and master
bind = $mainMod, U, layoutmsg, togglesplit
