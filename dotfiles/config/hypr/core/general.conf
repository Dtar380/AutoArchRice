# =============================================================================
#  General Hyprland Settings
#  Basic behavior, layout, gaps, and borders
# =============================================================================

# Layout
general {
    layout = dwindle

    # Gaps between windows
    gaps_in = 8
    gaps_out = 12

    # Border settings
    border_size = 2
    col.active_border = rgba(88c0d0ff)      # Nord theme accent (will be overridden by colors.conf)
    col.inactive_border = rgba(3b4252ff)    # Nord theme background

    # Resize on border/titlebar drag
    resize_on_border = false

    # Extend border over floating windows
    extend_border_grab_area = 15

    # Allow tearing for performance (optional)
    allow_tearing = false
}
