# =============================================================================
#  General Hyprland Settings
#  Basic behavior, layout, gaps, and borders
# =============================================================================

# Layout
general {
    layout = dwindle

    # Gaps between windows
    gaps_in = 8
    gaps_out = 12

    # Border settings
    border_size = 2
    # Use theme colors from colors.conf (fallback to Nord if undefined)
    col.active_border = $frost2        # Cyan from colors.conf
    col.inactive_border = $pol2        # Dark background from colors.conf

    # Resize on border/titlebar drag
    resize_on_border = false

    # Extend border over floating windows
    extend_border_grab_area = 15

    # Allow tearing for performance (optional)
    allow_tearing = false
}
