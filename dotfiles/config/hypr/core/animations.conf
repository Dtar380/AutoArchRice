# =============================================================================
#  Animation Configuration
#  Smooth transitions and visual effects
# =============================================================================

# Animations: enabled by default for a modern feel
animations {
    enabled = true

    # Animation speed: moderate (0.1 = very fast, 1.0 = slow)
    animation = windows, 1, 7, default, popin
    animation = windowsOut, 1, 7, default, popin
    animation = windowsMove, 1, 3, default, popin
    animation = windowsIn, 1, 7, default, popin

    # Border animations
    animation = border, 1, 10, default

    # Fade animations
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slidevert

    # Special animations
    animation = specialWorkspace, 1, 7, default, slideVert
    animation = layers, 1, 5, default, popin
}

# Bezier curves for custom animation timing
bezier = overshot, 0.05, 0.9, 0.1, 1.05
bezier = smoothOut, 0.36, 0, 0.66, -0.56
bezier = smoothIn, 0.25, 1, 0.5, 1
bezier = linear, 0, 0, 1, 1
