# =============================================================================
#  Hyprland Configuration
#  Modular setup with auto-detected monitor profile and keyboard language
# =============================================================================

# Load theme colors (symlink to active theme)
source = ~/.config/hypr/colors.conf

# Load monitor-specific configuration (auto-selected during install)
source = ~/.config/hypr/monitors.conf

# Load keyboard configuration (auto-generated by installer)
source = ~/.config/hypr/keyboard.conf

# Load core configurations
source = ~/.config/hypr/core/general.conf
source = ~/.config/hypr/core/animations.conf
source = ~/.config/hypr/core/decoration.conf
source = ~/.config/hypr/core/input.conf
source = ~/.config/hypr/core/dwindle.conf
source = ~/.config/hypr/core/master.conf
source = ~/.config/hypr/core/device.conf
source = ~/.config/hypr/core/misc.conf

# Load workspaces (4 static workspaces only)
source = ~/.config/hypr/core/workspaces.conf

# Load bindings
source = ~/.config/hypr/core/binds.conf

# Load gestures
source = ~/.config/hypr/core/gestures.conf

# Load extra configurations
source = ~/.config/hypr/extra/rules/default.conf

# Load autostart (must be last)
source = ~/.config/hypr/core/auto-start.conf
